name: Google Drive uploads

# Uploads queued delivery orders and monthly invoices to the XCMS Shared Drive.
# Runs every 15 minutes. Vercel Hobby allows only 2 cron jobs, so this runs from
# GitHub Actions like the other scheduled jobs. The endpoint is idempotent: a
# record already uploaded is replaced in place, never duplicated.
#
# Requires repo secret: CRON_SECRET (same value as the Vercel env var).

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call drive-uploads worker (2 attempts)
        run: |
          set -u
          URL="https://consignmentportal.vercel.app/api/cron/drive-uploads"
          for attempt in 1 2; do
            echo "Attempt ${attempt}…"
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              --max-time 90 "$URL" || echo "000")
            echo "HTTP ${code}"
            cat /tmp/resp.json || true
            echo ""
            if [ "$code" = "200" ]; then
              echo "✓ Drive worker finished."
              exit 0
            fi
            sleep 30
          done
          echo "✗ Drive worker failed — check Vercel logs for /api/cron/drive-uploads."
          exit 1
